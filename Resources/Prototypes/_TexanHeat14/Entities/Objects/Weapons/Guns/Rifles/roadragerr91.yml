- type: entity
  name: R-91 'Road Warrior'
  parent: N14WeaponRifleBase
  id: TH14WeaponRifleR91Highwaymen
  description: An R-91 rifle modifed by the Highwaymen to be more effective on the road. Modified with a wire stock and bayonet. Chambered in 5.56.
  components:
  - type: Item
    sprite: _TexanHeat14/Objects/Weapons/Guns/Rifles/roadragerr91.rsi
  - type: Clothing
    sprite: _TexanHeat14/Objects/Weapons/Guns/Rifles/roadragerr91.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _TexanHeat14/Objects/Weapons/Guns/Rifles/roadragerr91_icon.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    minAngle: 24
    maxAngle: 45
    angleIncrease: 4
    angleDecay: 16
    soundGunshot:
      collection: N14RifleR91Gunshot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine556Rifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine556Rifle
      gun_chamber:
        name: Chamber
        startingItem: N14Cartridge556Rifle
        priority: 1
        whitelist:
          tags:
            - N14Cartridge556Rifle
  - type: StaticPrice
    price: 100
  - type: MeleeWeapon
    attackRate: 1.3333
    damage:
      types:
        Slash: 15
